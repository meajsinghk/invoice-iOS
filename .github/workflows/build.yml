name: Build iOS IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project SimpleInvoice.xcodeproj \
            -scheme SimpleInvoice \
            -clonedSourcePackagesDirPath .build

      - name: Build for iOS device (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project SimpleInvoice.xcodeproj \
            -scheme SimpleInvoice \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build | xcpretty || true

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "SimpleInvoice.app" | head -1)
          echo "Found .app at: $APP_PATH"
          mkdir -p build/ipa/Payload
          cp -r "$APP_PATH" build/ipa/Payload/
          cd build/ipa && zip -r ../../SimpleInvoice-unsigned.ipa Payload
          cd ../.. && ls -lh SimpleInvoice-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleInvoice-unsigned-ipa
          path: SimpleInvoice-unsigned.ipa
          retention-days: 30

      - name: Build for Simulator (sanity check)
        run: |
          set -o pipefail
          xcodebuild \
            -project SimpleInvoice.xcodeproj \
            -scheme SimpleInvoice \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty || true
