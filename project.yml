name: SimpleInvoice
options:
  bundleIdPrefix: com.simpleinvoice
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.2"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.simpleinvoice.app
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  SimpleInvoice:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: .
        excludes:
          - "*.yml"
          - "*.md"
          - "*.plist"
          - ".github/**"
          - ".gitignore"
          - ".git/**"
          - "build/**"
          - ".build/**"
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_NAME: SimpleInvoice
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
    dependencies:
      - sdk: MessageUI.framework
      - sdk: PDFKit.framework
      - sdk: PencilKit.framework
